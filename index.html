<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DA20 Katana Mastery v6.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input:focus { font-size: 16px !important; }
        .timer-glow { text-shadow: 0 0 15px rgba(245, 158, 11, 0.6); }
        .modal-animate { animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        input:read-only { color: #94a3b8; cursor: not-allowed; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-amber-500/30">

    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col relative">
        
        <div id="custom-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/80 backdrop-blur-sm">
            <div class="bg-slate-900 border-2 border-amber-500/50 p-8 rounded-[2.5rem] w-full max-w-xs shadow-2xl modal-animate text-center">
                <div id="modal-icon" class="text-4xl mb-4"></div>
                <h3 id="modal-title" class="text-xl font-black mb-2 italic uppercase"></h3>
                <p id="modal-body" class="text-slate-400 text-sm font-bold mb-6"></p>
                <button id="modal-btn" class="w-full bg-amber-600 py-4 rounded-2xl font-black text-black uppercase italic active:scale-95 transition-all">DEVAM ET</button>
            </div>
        </div>

        <header id="main-header" class="text-center py-8 px-4">
            <h1 class="text-4xl font-black text-amber-500 tracking-tighter italic">DA20 KATANA</h1>
            <p class="text-slate-500 text-[10px] mt-1 font-bold tracking-[0.3em] uppercase">Emergency & Scenario Pro</p>
        </header>

        <div id="category-screen" class="p-4 space-y-4">
            <button onclick="showScenarios()" class="w-full bg-emerald-600 p-8 rounded-[2rem] flex flex-col items-center shadow-2xl active:scale-95 transition-all border-b-4 border-emerald-800">
                <span class="text-4xl mb-2">✈️</span>
                <span class="font-black text-2xl italic uppercase tracking-tight">SCENARIOS</span>
            </button>
            <button onclick="showList('must')" class="w-full bg-amber-600 p-8 rounded-[2rem] flex flex-col items-center shadow-2xl active:scale-95 transition-all border-b-4 border-amber-800 text-black">
                <span class="text-4xl mb-2">🚨</span>
                <span class="font-black text-2xl italic uppercase tracking-tight">MUST KNOW</span>
            </button>
            <button onclick="showList('all')" class="w-full bg-slate-900 border border-slate-800 p-8 rounded-[2rem] flex flex-col items-center shadow-xl active:scale-95 transition-all">
                <span class="text-4xl mb-2">📋</span>
                <span class="font-black text-2xl italic uppercase tracking-tight text-white">ALL LIST</span>
            </button>
        </div>

        <div id="list-screen" class="hidden p-4">
            <div class="flex items-center justify-between mb-6">
                <button onclick="showCategory()" class="text-slate-400 font-black text-xs bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl">← GERİ</button>
                <span id="list-title" class="text-amber-500 font-black text-xs tracking-widest uppercase italic"></span>
            </div>
            <button onclick="startGlobalRandom()" class="w-full bg-indigo-600 p-5 rounded-2xl font-black italic mb-8 shadow-lg active:scale-95 transition-all flex items-center justify-center gap-3 border-b-4 border-indigo-800 uppercase text-sm">
                <span>🔀</span> Karma Sınav Başlat
            </button>
            <div id="checklist-links" class="space-y-3 pb-10"></div>
        </div>

        <div id="scenario-screen" class="hidden p-6 flex-1 flex flex-col">
            <div class="flex items-center justify-between mb-6">
                <button onclick="showCategory()" class="text-slate-400 font-black text-xs bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl">← GERİ</button>
                <span class="text-emerald-500 font-black text-xs tracking-widest uppercase italic font-black">MISSION CONTROL</span>
            </div>
            <div id="scenario-content" class="bg-slate-900 border-2 border-emerald-500/30 p-8 rounded-[2.5rem] shadow-2xl">
                </div>
        </div>

        <div id="quiz-screen" class="hidden flex-1 flex flex-col">
            <div class="bg-slate-900 border-b border-amber-500/20 p-5 sticky top-0 z-50 rounded-b-[2rem]">
                <div class="flex justify-between items-center">
                    <div class="flex flex-col">
                        <span class="text-[9px] font-black text-amber-500/50 uppercase">Süre</span>
                        <span id="timer-display" class="text-4xl font-mono font-black text-amber-500 timer-glow leading-none mt-1">0.0s</span>
                    </div>
                    <div class="text-right">
                        <div id="quiz-stack-progress" class="text-[10px] font-black text-slate-500 mb-1 tracking-tighter"></div>
                        <div id="best-time-display" class="text-[10px] font-black text-emerald-500 italic"></div>
                    </div>
                </div>
                <div class="w-full bg-slate-800 h-1.5 rounded-full mt-4 overflow-hidden">
                    <div id="progress-bar" class="bg-amber-500 h-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <div class="p-4 flex-1 flex flex-col justify-center max-w-sm mx-auto w-full">
                <h2 id="current-title" class="text-xl font-black mb-8 text-center leading-tight text-white uppercase italic min-h-[4rem] flex items-center justify-center"></h2>
                
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-[2.5rem] shadow-2xl space-y-6 text-black">
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase mb-2 ml-2 tracking-widest italic text-left">ITEM</label>
                        <input type="text" id="user-item" class="w-full bg-slate-800 border-2 border-slate-700 p-4 rounded-2xl focus:outline-none focus:border-amber-500 text-white font-bold transition-all text-lg" autocomplete="off" spellcheck="false">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase mb-2 ml-2 tracking-widest italic text-left">ACTION</label>
                        <input type="text" id="user-action" class="w-full bg-slate-800 border-2 border-slate-700 p-4 rounded-2xl focus:outline-none focus:border-amber-500 text-white font-bold transition-all text-lg" autocomplete="off" spellcheck="false">
                    </div>
                    <button onclick="checkAnswer()" id="check-btn" class="w-full bg-amber-600 py-5 rounded-2xl font-black text-xl shadow-lg active:scale-95 transition-all text-black uppercase italic">KONTROL ET</button>
                    <div id="feedback" class="mt-4 p-4 rounded-2xl hidden text-center font-bold text-sm border"></div>
                </div>
                <button onclick="exitQuiz()" class="mt-10 text-slate-600 font-black text-[10px] uppercase tracking-[0.4em]">SINAVI YARIDA KES</button>
            </div>
        </div>
    </div>

    <script>
        // --- DATA ---
        const checklists = {
            "1": { name: "Engine Failure during Take-off Run", must: true, steps: [{i:"Throttle", a:"IDLE"}, {i:"Brakes", a:"as required"}, {i:"Flaps", a:"CRUISE"}, {i:"Mixture", a:"IDLE CUT-OFF"}, {i:"Ignition Switch", a:"OFF"}, {i:"GEN/BAT Master Switch", a:"OFF"}] },
            "2": { name: "Engine Failure after Take-off", must: true, steps: [{i:"Airspeed", a:"60 KIAS"}, {i:"Throttle", a:"FULL"}, {i:"Mixture", a:"FULL RICH"}, {i:"Alternate Air", a:"ON"}, {i:"Fuel Shut-off Valve", a:"OPEN"}, {i:"Ignition Switch", a:"BOTH"}, {i:"Fuel Pump", a:"ON"}] },
            "3": { name: "Engine Failure during Flight (Rough)", must: true, steps: [{i:"Mixture", a:"FULL RICH"}, {i:"Alternate Air", a:"OPEN"}, {i:"Fuel Shut-off Valve", a:"OPEN"}, {i:"Fuel Pump", a:"ON"}, {i:"Ignition Switch", a:"cycle L-BOTH-R-BOTH"}, {i:"Throttle", a:"at present position"}] },
            "4": { name: "Restarting Engine (Windmilling)", must: true, steps: [{i:"Airspeed", a:"73 KIAS"}, {i:"Mixture", a:"FULL RICH"}, {i:"Fuel Shut-off Valve", a:"OPEN"}, {i:"Ignition Switch", a:"BOTH"}, {i:"Fuel Pump", a:"ON"}, {i:"Fuel Prime", a:"ON"}, {i:"Throttle", a:"3/4 in forward"}] },
            "5": { 
                name: "Emergency Landing with Engine Off", 
                must: true, 
                steps: [
                    {i:"Airspeed (Flaps CRUISE)", a:"64 KIAS", fixedItem: true},
                    {i:"Airspeed (Flaps T/O)", a:"60 KIAS", fixedItem: true},
                    {i:"Airspeed (Flaps LDG)", a:"55 KIAS", fixedItem: true},
                    {i:"Fuel Shut-off Valve", a:"CLOSED"},
                    {i:"Mixture", a:"IDLE CUT-OFF"},
                    {i:"Ignition Switch", a:"OFF"},
                    {i:"Safety Belts", a:"secured"},
                    {i:"Radio", a:"121.5 Mhz, location and intentions", allFixed: true},
                    {i:"Flaps", a:"as required"},
                    {i:"GEN/BAT Master Switch", a:"OFF"},
                    {i:"After Touch-Down", a:"Apply brakes", fixedItem: true}
                ] 
            },
            "6": { name: "Restarting Engine (Full Stop)",
                  must: true, steps: [{i:"Airspeed", a:"73 KIAS"},
                                      {i:"Electrically Powered Equipment", a:"OFF"},
                                      {i:"GEN/BAT Master Switch", a:"ON"},
                                      {i:"Mixture", a:"Full Rich"},
                                      {i:"Fuel Shut off Valve", a:"OPEN"},
                                      {i:"Fuel Pump", a:"ON"},
                                      {i:"Fuel Prime", a:"ON"},
                                      {i:"Throttle", a:"2 cm forward"},
                                      {i:"Ignition Switch", a:"Start"},
                                      {i:"Ignition Switch with Push-to-Start (Optional)", a:"Start (TURN then PUSH"}, fixedItem: true] }, 
            "7": { name: "After Successful Restart", must: true, steps: [{i:"Oil Pressure", a:"Check"}, {i:"Oil Temperature", a:"Check"}, {i:"Fuel Prime", a:"Off"}, {i:"Electrically Powered Equipment", a:"ON if required"}, fixedItem: true] },
            "8": { name: "Shortly Before Landing", must: true, steps: [{i:"Mixture", a:"Full Rich"},{i:"Fuel Shut off Valve", a:"Closed"}, {i:"Ignition Switch", a:"Off"}, {i:"Flaps", a:"as required"},{i:"GEN/BAT Master Switch", a:"Off"}] }
        };

        const scenarioConfig = {
            "engine_failure_area": {
                steps: [
                    {
                        text: "Çalışma sahasında uçuşunu yaparken aniden motor gücü kayboldu! İlk önceliğin nedir?",
                        options: [{ text: "Airspeed 73 KIAS & Trim (Best Glide)", next: 1 }]
                    },
                    {
                        text: "Hızı stabilize ettin. Şimdi uygun iniş alanı seçmelisin. Rüzgar ve zemin durumu nedir?",
                        options: [{ text: "Rüzgar içine 60° alan, Upslope arazi, mevsime göre Sarı/Yeşil tarla", next: 2 }]
                    },
                    {
                        text: "Alan seçildi. Şimdi 5F (Fire, FOD, Fume, Frozen, Final) kontrolü yap ve pervaneyi gözle. Dönü var mı?",
                        options: [
                            { text: "EVET (Dönü var)", checklist: "4", nextStepAfterQuiz: 3 },
                            { text: "HAYIR (Pervane durdu)", checklist: "6", nextStepAfterQuiz: 3 }
                        ]
                    },
                    {
                        text: "Checklist uygulandı. Motor çalıştı mı?",
                        options: [
                            { text: "EVET (Motor çalıştı)", checklist: "7", endScenario: true },
                            { text: "HAYIR (Motor çalışmadı)", checklist: "5", nextStepAfterQuiz: 4 }
                        ]
                    },
                    {
                        text: "Mayday çağrısı yap ve Transponder'ı 7700'e bağla: 'Mayday (3x), Hezarfen, Callsign, Engine Failure, Forced Landing, Training Area X, POB Y'. Son yaklaşmaya gelindi.",
                        options: [{ text: "Shortly Before Landing Checklist Uygula", checklist: "8", nextStepAfterQuiz: 5 }]
                    },
                    {
                        text: "Yere çok yaklaştın. İniş sonrası son planın nedir?",
                        options: [{ text: "Evacuation planını gerçekleştir ve uçağı terk et.", endScenario: true }]
                    }
                ]
            }
        };

        // --- STATE ---
        let currentCategory = 'all';
        let quizStack = [];
        let currentQuizIdx = 0;
        let currentStepIdx = 0;
        let wrongSteps = [];
        let timerStart, timerInterval;
        let activeScenario = null;
        let activeScenarioStep = 0;

        // --- NAVIGATION ---
        function showCategory() {
            document.getElementById('main-header').classList.remove('hidden');
            document.getElementById('category-screen').classList.remove('hidden');
            document.getElementById('list-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('scenario-screen').classList.add('hidden');
            activeScenario = null;
        }

        function showList(cat) {
            currentCategory = cat;
            document.getElementById('main-header').classList.add('hidden');
            document.getElementById('category-screen').classList.add('hidden');
            document.getElementById('list-screen').classList.remove('hidden');
            document.getElementById('list-title').innerText = cat === 'must' ? "🚨 MUST KNOW" : "📋 FULL LIST";
            const container = document.getElementById('checklist-links');
            container.innerHTML = '';
            Object.keys(checklists).forEach(id => {
                if(cat === 'all' || (cat === 'must' && checklists[id].must)) {
                    const best = localStorage.getItem(`best_${id}`);
                    const btn = document.createElement('div');
                    btn.className = "bg-slate-900 p-5 rounded-2xl border border-slate-800 flex justify-between items-center active:bg-slate-800 cursor-pointer";
                    btn.onclick = () => { quizStack = [id]; initQuiz(); };
                    btn.innerHTML = `<div><div class="text-[13px] font-black italic uppercase">${checklists[id].name}</div>${best ? `<span class="text-[9px] text-emerald-500 font-black italic tracking-widest">🏆 ${best}s</span>` : ''}</div><span class="text-slate-700">→</span>`;
                    container.appendChild(btn);
                }
            });
        }

        function showScenarios() {
            document.getElementById('main-header').classList.add('hidden');
            document.getElementById('category-screen').classList.add('hidden');
            document.getElementById('scenario-screen').classList.remove('hidden');
            renderScenarioStep("engine_failure_area", 0);
        }

        // --- SCENARIO LOGIC ---
        function renderScenarioStep(key, stepIdx) {
            activeScenario = key;
            activeScenarioStep = stepIdx;
            const step = scenarioConfig[key].steps[stepIdx];
            const container = document.getElementById('scenario-content');
            
            let optionsHtml = step.options.map((opt, i) => `
                <button onclick='handleScenarioOption(${JSON.stringify(opt)})' 
                        class="w-full bg-slate-800 hover:bg-emerald-600 p-5 rounded-2xl text-left font-bold transition-all border border-slate-700 mb-4 italic text-sm">
                    ${opt.text}
                </button>
            `).join('');

            container.innerHTML = `
                <div class="mb-6"><span class="bg-emerald-500 text-black px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest">ADIM ${stepIdx + 1}</span></div>
                <p class="text-white font-bold text-lg mb-8 leading-relaxed">${step.text}</p>
                <div class="space-y-2">${optionsHtml}</div>
            `;
        }

        function handleScenarioOption(opt) {
            if (opt.checklist) {
                quizStack = [opt.checklist];
                // Senaryonun nereden devam edeceğini sakla
                activeScenarioNextStep = opt.endScenario ? -1 : opt.nextStepAfterQuiz;
                initQuiz();
            } else if (opt.next !== undefined) {
                renderScenarioStep(activeScenario, opt.next);
            } else if (opt.endScenario) {
                showAlert("🏆", "MİSYON BAŞARILI", "Tüm prosedürleri uyguladın. Safe Landing!", "MENÜYE DÖN", showCategory);
            }
        }

        // --- QUIZ LOGIC ---
        function initQuiz() {
            currentQuizIdx = 0; currentStepIdx = 0; wrongSteps = [];
            document.getElementById('list-screen').classList.add('hidden');
            document.getElementById('scenario-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            startTimer(); nextQuestion();
        }

        function nextQuestion() {
            const quizId = quizStack[currentQuizIdx];
            if (!quizId) return;
            const quiz = checklists[quizId];
            const best = localStorage.getItem(`best_${quizId}`);

            if (currentStepIdx >= quiz.steps.length) {
                clearInterval(timerInterval);
                if (wrongSteps.length > 0) {
                    showAlert("🔄", "TEKRAR", "Yanlış maddeleri düzeltelim.", "HAZIRIM", () => {
                        quiz.steps = [...wrongSteps]; wrongSteps = [];
                        currentStepIdx = 0; startTimer(); nextQuestion();
                    });
                } else {
                    const finalS = ((Date.now() - timerStart) / 1000).toFixed(1);
                    if (!best || parseFloat(finalS) < parseFloat(best)) localStorage.setItem(`best_${quizId}`, finalS);
                    
                    showAlert("✅", "TAMAMLANDI", `Checklist süresi: ${finalS}s`, activeScenario ? "SENARYOYA DEVAM ET" : "DEVAM ET", () => {
                        if (activeScenario) {
                            if (activeScenarioNextStep === -1) {
                                showAlert("🏆", "MİSYON BAŞARILI", "Senaryoyu başarıyla tamamladın.", "ANA MENÜ", showCategory);
                            } else {
                                document.getElementById('quiz-screen').classList.add('hidden');
                                document.getElementById('scenario-screen').classList.remove('hidden');
                                renderScenarioStep(activeScenario, activeScenarioNextStep);
                            }
                        } else if (currentQuizIdx < quizStack.length - 1) {
                            currentQuizIdx++; currentStepIdx = 0; startTimer(); nextQuestion();
                        } else { exitQuiz(); }
                    });
                }
                return;
            }

            const currentStep = quiz.steps[currentStepIdx];
            document.getElementById('best-time-display').innerText = best ? `BEST: ${best}s` : "NEW";
            document.getElementById('quiz-stack-progress').innerText = `PROCEDURE ${currentQuizIdx + 1}/${quizStack.length}`;
            document.getElementById('progress-bar').style.width = ((currentStepIdx / quiz.steps.length) * 100) + "%";
            document.getElementById('current-title').innerText = quiz.name;
            
            const itemInput = document.getElementById('user-item');
            const actionInput = document.getElementById('user-action');

            if (currentStep.allFixed) {
                itemInput.value = currentStep.i; actionInput.value = currentStep.a;
                itemInput.readOnly = actionInput.readOnly = true;
                itemInput.classList.add('opacity-50'); actionInput.classList.add('opacity-50');
                document.getElementById('check-btn').focus();
            } else if (currentStep.fixedItem) {
                itemInput.value = currentStep.i; itemInput.readOnly = true;
                itemInput.classList.add('opacity-50'); actionInput.value = "";
                actionInput.readOnly = false; actionInput.classList.remove('opacity-50');
                actionInput.focus();
            } else {
                itemInput.value = ""; actionInput.value = "";
                itemInput.readOnly = actionInput.readOnly = false;
                itemInput.classList.remove('opacity-50'); actionInput.classList.remove('opacity-50');
                itemInput.focus();
            }
            document.getElementById('feedback').classList.add('hidden');
        }

        function checkAnswer() {
            const ui = document.getElementById('user-item').value;
            const ua = document.getElementById('user-action').value;
            const correct = checklists[quizStack[currentQuizIdx]].steps[currentStepIdx];
            const fb = document.getElementById('feedback');
            fb.classList.remove('hidden');

            const itemCorrect = isCorrect(ui, correct.i);
            const actionCorrect = isCorrect(ua, correct.a);

            if (itemCorrect && actionCorrect) {
                fb.className = "mt-4 p-4 rounded-2xl text-center bg-green-500/10 text-green-400 border-green-500/30";
                fb.innerText = `✅ DOĞRU (${correct.a})`;
                setTimeout(() => { currentStepIdx++; nextQuestion(); }, 700);
            } else {
                fb.className = "mt-4 p-4 rounded-2xl text-center bg-red-500/10 text-red-400 border-red-500/30";
                fb.innerHTML = `<span class="text-[10px] block opacity-60 mb-1 uppercase">Hata!</span>${correct.i} → ${correct.a}`;
                wrongSteps.push(JSON.parse(JSON.stringify(correct)));
                setTimeout(() => { currentStepIdx++; nextQuestion(); }, 2500);
            }
        }

        // --- HELPERS ---
        function getLevenshteinDistance(s1, s2) {
            if (!s1 || !s2) return 99;
            s1 = s1.toLowerCase().replace('kias', '').trim();
            s2 = s2.toLowerCase().replace('kias', '').trim();
            if (s1 === s2) return 0;
            const costs = [];
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i === 0) costs[j] = j;
                    else if (j > 0) {
                        let newValue = costs[j - 1];
                        if (s1.charAt(i - 1) !== s2.charAt(j - 1))
                            newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                        costs[j - 1] = lastValue; lastValue = newValue;
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        function isCorrect(input, correct) {
            const dist = getLevenshteinDistance(input, correct);
            return (correct.toLowerCase().replace('kias', '').trim().length <= 4) ? dist <= 1 : dist <= 2;
        }

        function showAlert(icon, title, body, btnText, callback) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerText = body;
            const btn = document.getElementById('modal-btn');
            btn.innerText = btnText;
            modal.classList.remove('hidden');
            btn.onclick = () => { modal.classList.add('hidden'); if (callback) callback(); };
        }

        function startTimer() {
            timerStart = Date.now(); clearInterval(timerInterval);
            timerInterval = setInterval(() => { document.getElementById('timer-display').innerText = ((Date.now() - timerStart) / 1000).toFixed(1) + "s"; }, 100);
        }

        function exitQuiz() { 
            clearInterval(timerInterval); quizStack = []; currentQuizIdx = 0; currentStepIdx = 0; wrongSteps = [];
            document.getElementById('quiz-screen').classList.add('hidden'); 
            showCategory(); 
        }

        document.getElementById('user-item').addEventListener('keypress', (e) => { if(e.key === 'Enter') document.getElementById('user-action').focus(); });
        document.getElementById('user-action').addEventListener('keypress', (e) => { if(e.key === 'Enter') checkAnswer(); });

    </script>
</body>
</html>
