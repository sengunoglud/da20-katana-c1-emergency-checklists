<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DA20 Mastery - Timer Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input:focus { font-size: 16px !important; }
        .must-know-tag { background: #f59e0b; color: #000; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 900; margin-right: 8px; }
        .timer-glow { text-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <div id="app" class="max-w-md mx-auto p-4 pb-20">
        <header class="text-center py-6">
            <h1 class="text-3xl font-black text-amber-500 tracking-tighter italic">DA20 KATANA</h1>
            <p class="text-slate-500 text-[10px] mt-1 font-bold tracking-[0.2em]">EMERGENCY TIMER TRAINING</p>
        </header>

        <div id="category-screen" class="space-y-4">
            <button onclick="showList('must')" class="w-full bg-amber-600 p-8 rounded-3xl flex flex-col items-center shadow-lg active:scale-95 transition-all">
                <span class="text-3xl mb-2">🚨</span>
                <span class="font-black text-xl italic">MUST KNOW</span>
            </button>
            <button onclick="showList('all')" class="w-full bg-slate-800 p-8 rounded-3xl flex flex-col items-center shadow-lg active:scale-95 transition-all">
                <span class="text-3xl mb-2">📋</span>
                <span class="font-black text-xl italic">TÜM LİSTE (ALL)</span>
            </button>
        </div>

        <div id="list-screen" class="hidden">
            <div class="flex items-center justify-between mb-4">
                <button onclick="showCategory()" class="text-slate-400 font-bold text-xs bg-slate-900 px-3 py-1 rounded">← GERİ</button>
                <span id="list-title" class="text-amber-500 font-black text-xs tracking-widest uppercase"></span>
            </div>
            
            <button onclick="startGlobalRandom()" class="w-full bg-purple-600 p-4 rounded-2xl font-black italic mb-6 shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
                <span>🔀</span> KARMA SINAV (RANDOM)
            </button>

            <div class="text-[10px] text-slate-500 font-bold mb-2 ml-1 tracking-widest uppercase italic">Prosedür Seçimi:</div>
            <div id="checklist-links" class="space-y-3"></div>
        </div>

        <div id="quiz-screen" class="hidden">
            <div class="flex justify-between items-end mb-4">
                <div class="flex flex-col">
                    <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Süre</span>
                    <span id="timer-display" class="text-2xl font-mono font-black text-amber-500 timer-glow">0.0s</span>
                </div>
                <div class="flex flex-col items-end">
                    <span id="best-time-display" class="text-[9px] font-bold text-slate-500 mb-1 uppercase tracking-tighter"></span>
                    <div id="step-progress" class="text-xs font-black text-slate-300"></div>
                </div>
            </div>

            <div class="w-full bg-slate-900 h-1 rounded-full mb-6 overflow-hidden">
                <div id="progress-bar" class="bg-amber-500 h-full transition-all duration-300" style="width: 0%"></div>
            </div>
            
            <h2 id="current-title" class="text-xl font-black mb-6 text-center leading-tight min-h-[3rem] flex items-center justify-center"></h2>
            
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-2xl space-y-5 relative">
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase mb-2 ml-1 italic tracking-widest">ITEM</label>
                    <input type="text" id="user-item" class="w-full bg-slate-800 border-2 border-slate-700 p-4 rounded-2xl focus:outline-none focus:border-amber-500 text-white font-bold transition-all" autocomplete="off" spellcheck="false">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase mb-2 ml-1 italic tracking-widest">ACTION</label>
                    <input type="text" id="user-action" class="w-full bg-slate-800 border-2 border-slate-700 p-4 rounded-2xl focus:outline-none focus:border-amber-500 text-white font-bold transition-all" autocomplete="off" spellcheck="false">
                </div>
                <button onclick="checkAnswer()" class="w-full bg-amber-600 py-5 rounded-2xl font-black text-xl shadow-lg active:scale-95 transition-all italic">KONTROL ET</button>
                <div id="feedback" class="mt-4 p-4 rounded-2xl hidden text-center font-bold text-sm"></div>
            </div>
            
            <button onclick="exitQuiz()" class="w-full mt-6 text-slate-600 font-bold text-xs uppercase tracking-widest">Sınavı Yarıda Kes</button>
        </div>
    </div>

    <script>
        // LEVENSHTEIN & TYPO LOGIC
        function getLevenshteinDistance(s1, s2) {
            if (!s1 || !s2) return 99;
            s1 = s1.toLowerCase().trim(); s2 = s2.toLowerCase().trim();
            if (s1 === s2) return 0;
            const costs = [];
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i === 0) costs[j] = j;
                    else if (j > 0) {
                        let newValue = costs[j - 1];
                        if (s1.charAt(i - 1) !== s2.charAt(j - 1))
                            newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                        costs[j - 1] = lastValue; lastValue = newValue;
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        function isCorrect(input, correct) {
            const dist = getLevenshteinDistance(input, correct);
            return (correct.length <= 4) ? dist <= 1 : dist <= 2;
        }

        const checklists = {
            "1": { name: "Engine Failure during Take-off Run", must: true, steps: [{i:"Throttle", a:"IDLE"}, {i:"Brakes", a:"as required"}, {i:"Flaps", a:"CRUISE"}, {i:"Mixture", a:"IDLE CUT-OFF"}, {i:"Ignition Switch", a:"OFF"}, {i:"GEN/BAT Master Switch", a:"OFF"}] },
            "2": { name: "Engine Failure after Take-off", must: true, steps: [{i:"Airspeed", a:"60 KIAS"}, {i:"Throttle", a:"FULL"}, {i:"Mixture", a:"FULL RICH"}, {i:"Alternate Air", a:"ON"}, {i:"Fuel Shut-off Valve", a:"OPEN"}, {i:"Ignition Switch", a:"BOTH"}, {i:"Fuel Pump", a:"ON"}] },
            "3": { name: "Engine Failure during Flight (Rough)", must: true, steps: [{i:"Mixture", a:"FULL RICH"}, {i:"Alternate Air", a:"OPEN"}, {i:"Fuel Shut-off Valve", a:"OPEN"}, {i:"Fuel Pump", a:"ON"}, {i:"Ignition Switch", a:"cycle L-BOTH-R-BOTH"}, {i:"Throttle", a:"at present position"}] },
            "4": { name: "Restarting Engine (Windmilling)", must: true, steps: [{i:"Airspeed", a:"73 KIAS"}, {i:"Mixture", a:"FULL RICH"}, {i:"Fuel Shut-off Valve", a:"OPEN"}, {i:"Ignition Switch", a:"BOTH"}, {i:"Fuel Pump", a:"ON"}, {i:"Fuel Prime", a:"ON"}, {i:"Throttle", a:"3/4 in forward"}] },
            "5": { name: "Emergency Landing with Engine Off", must: true, steps: [{i:"Airspeed (Flaps T/O)", a:"60 KIAS"}, {i:"Airspeed (Flaps LDG)", a:"55 KIAS"},{i:"Airspeed (Flaps Cruise)", a:"64 KIAS"}, {i:"Fuel Shut-off Valve", a:"CLOSED"}, {i:"Mixture", a:"IDLE CUT-OFF"}, {i:"Ignition Switch", a:"OFF"}, {i:"Safety Belts", a:"secured"}, {i:"Radio", a:"transmit, 121.5 Mhz, giving location and intentions"}, {i:"Flaps", a:"as required"}, {i:"GEN/BAT Master Switch", a:"OFF"}, {i:"After Touch-Down", a:"Apply brakes"}] },
            "6": { name: "Trim System Failure (Runaway)", must: true, steps: [{i:"Control Stick", a:"Grip and maintain control"}, {i:"Trim motor circuit breaker", a:"Pull"}, {i:"Rocker Switch", a:"Check"}] },
            "7": { name: "Flap System Failure", must: true, steps: [{i:"Visual Check", a:"Verify position"}, {i:"Flap Control Circuit Breaker", a:"Check/Reset"}, {i:"Flap Switch", a:"Check"}, {i:"Airspeed", a:"Within white arc"}] },
            "8": { name: "Engine Fire during Flight", must: false, steps: [{i:"Fuel Shut-off Valve", a:"CLOSED"}, {i:"Cabin Heat", a:"CLOSED"}, {i:"Airspeed", a:"73 KIAS"}, {i:"Fuel Pump", a:"OFF"}] },
            "9": { name: "Electrical Fire during Flight", must: false, steps: [{i:"GEN/BAT Master Switch", a:"OFF"}, {i:"Cabin Air", a:"OPEN"}, {i:"Avionics Master Switch", a:"OFF"}, {i:"Circuit Breakers", a:"Pull all"}] },
            "10": { name: "Recovery from Unintentional Spin", must: false, steps: [{i:"Throttle", a:"IDLE"}, {i:"Rudder", a:"fully opposite to spin"}, {i:"Control Stick", a:"ease forward"}, {i:"Wing Flaps", a:"CRUISE"}] },
            "11": { name: "Precautionary Landing", must: false, steps: [{i:"Search for landing site", a:"Select field"}, {i:"Safety Belts", a:"Secured"}, {i:"Airspeed", a:"60 KIAS"}, {i:"Flaps", a:"T/O"}] },
            "12": { name: "Generator Failure", must: false, steps: [{i:"GEN Master Switch", a:"Cycle OFF-ON"}, {i:"Non-essential equipment", a:"OFF"}, {i:"Ammeter", a:"Monitor"}] },
            "13": { name: "Icing", must: false, steps: [{i:"Pitot Heat", a:"ON"}, {i:"Icing area", a:"Leave immediately"}, {i:"Cabin Heat", a:"OPEN"}] },
            "14": { name: "Engine Fire on Ground", must: false, steps: [{i:"Fuel Shut-off Valve", a:"CLOSED"}, {i:"Mixture", a:"IDLE CUT-OFF"}, {i:"Ignition Switch", a:"OFF"}, {i:"Master Switch", a:"OFF"}] }
        };

        let currentCategory = 'all';
        let quizStack = [];
        let currentQuizIndex = 0;
        let currentStepIndex = 0;
        let wrongSteps = [];
        
        // TIMER VARIABLES
        let startTime;
        let timerInterval;

        document.getElementById('user-item').addEventListener('keypress', (e) => { if(e.key === 'Enter') document.getElementById('user-action').focus(); });
        document.getElementById('user-action').addEventListener('keypress', (e) => { if(e.key === 'Enter') checkAnswer(); });

        function showCategory() {
            document.getElementById('category-screen').classList.remove('hidden');
            document.getElementById('list-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
        }

        function showList(cat) {
            currentCategory = cat;
            document.getElementById('category-screen').classList.add('hidden');
            document.getElementById('list-screen').classList.remove('hidden');
            document.getElementById('list-title').innerText = cat === 'must' ? "🚨 MUST KNOW" : "📋 TÜM LİSTE";
            const container = document.getElementById('checklist-links');
            container.innerHTML = '';
            Object.keys(checklists).forEach(id => {
                if(cat === 'all' || (cat === 'must' && checklists[id].must)) {
                    const best = localStorage.getItem(`best_${id}`);
                    const btn = document.createElement('div');
                    btn.className = "bg-slate-900 p-4 rounded-xl border border-slate-800 flex justify-between items-center active:bg-slate-800 transition";
                    btn.onclick = () => startSingleQuiz(id);
                    btn.innerHTML = `
                        <div class="flex flex-col">
                            <div class="text-sm font-bold flex items-center">${checklists[id].must ? '<span class="must-know-tag">MUST</span>' : ''}${checklists[id].name}</div>
                            ${best ? `<span class="text-[9px] text-amber-600 font-black mt-1 uppercase italic tracking-tighter">🏆 Rekor: ${best}s</span>` : ''}
                        </div>
                        <span class="text-slate-600">→</span>`;
                    container.appendChild(btn);
                }
            });
        }

        function startSingleQuiz(id) { quizStack = [id]; initQuiz(); }
        function startGlobalRandom() {
            quizStack = Object.keys(checklists).filter(id => currentCategory === 'all' || checklists[id].must);
            quizStack.sort(() => Math.random() - 0.5);
            initQuiz();
        }

        function initQuiz() {
            currentQuizIndex = 0; currentStepIndex = 0; wrongSteps = [];
            document.getElementById('list-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            startTimer();
            nextQuestion();
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                document.getElementById('timer-display').innerText = elapsed.toFixed(1) + "s";
            }, 100);
        }

        function stopTimer() { clearInterval(timerInterval); return ((Date.now() - startTime) / 1000).toFixed(1); }

        function exitQuiz() { clearInterval(timerInterval); showList(currentCategory); }

        function nextQuestion() {
            const quizId = quizStack[currentQuizIndex];
            const quiz = checklists[quizId];
            const best = localStorage.getItem(`best_${quizId}`);

            if (currentStepIndex >= quiz.steps.length) {
                const finalTime = stopTimer();
                if (wrongSteps.length > 0) {
                    alert(`${quiz.name} bitti. Yanlışları tekrar edelim. (Timer sıfırlandı)`);
                    quiz.steps = [...wrongSteps]; wrongSteps = [];
                    currentStepIndex = 0; startTimer(); nextQuestion();
                } else {
                    // Rekor Kontrolü
                    if (!best || parseFloat(finalTime) < parseFloat(best)) {
                        localStorage.setItem(`best_${quizId}`, finalTime);
                        alert(`YENİ REKOR: ${finalTime}s!\nProsedür hatasız tamamlandı.`);
                    } else {
                        alert(`Süre: ${finalTime}s\n(Rekorun: ${best}s)\nProsedür tamamlandı.`);
                    }
                    
                    if (currentQuizIndex < quizStack.length - 1) {
                        currentQuizIndex++; currentStepIndex = 0; startTimer(); nextQuestion();
                    } else { exitQuiz(); }
                }
                return;
            }

            document.getElementById('best-time-display').innerText = best ? `Kişisel Rekor: ${best}s` : "";
            document.getElementById('step-progress').innerText = `${currentStepIndex + 1}/${quiz.steps.length} ADIM`;
            document.getElementById('progress-bar').style.width = ((currentStepIndex / quiz.steps.length) * 100) + "%";
            document.getElementById('current-title').innerText = quiz.name;
            document.getElementById('user-item').value = ""; document.getElementById('user-action').value = "";
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('user-item').focus();
        }

        function checkAnswer() {
            const ui = document.getElementById('user-item').value.trim();
            const ua = document.getElementById('user-action').value.trim();
            const quiz = checklists[quizStack[currentQuizIndex]];
            const correct = quiz.steps[currentStepIndex];
            const feedback = document.getElementById('feedback');

            feedback.classList.remove('hidden');
            if (isCorrect(ui, correct.i) && isCorrect(ua, correct.a)) {
                feedback.className = "mt-4 p-4 rounded-2xl text-center bg-green-500/20 text-green-400 border border-green-500/50";
                feedback.innerText = "✅ DOĞRU";
                setTimeout(() => { currentStepIndex++; nextQuestion(); }, 600);
            } else {
                feedback.className = "mt-4 p-4 rounded-2xl text-center bg-red-500/20 text-red-400 border border-red-500/50 shadow-lg shadow-red-900/20";
                feedback.innerHTML = `<div class="text-[10px] opacity-70 mb-1 font-black italic">HATA YAPILDI (Süre Devam Ediyor):</div><div>${correct.i} → ${correct.a}</div>`;
                wrongSteps.push(correct);
                setTimeout(() => { currentStepIndex++; nextQuestion(); }, 3000);
            }
        }
    </script>
</body>
</html>
