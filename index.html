<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DA20 Emergency Mastery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input:focus { font-size: 16px !important; }
        .must-know { border-left: 5px solid #f59e0b !important; }
        .all-item { border-left: 5px solid #334155; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <div id="app" class="max-w-md mx-auto p-4 pb-20">
        <header class="text-center py-8">
            <h1 class="text-3xl font-black text-amber-500 tracking-tighter">DA20 KATANA</h1>
            <p class="text-slate-500 text-xs mt-1 font-bold">EMERGENCY PROCEDURES POH SEC. 3</p>
        </header>

        <div id="category-screen" class="space-y-4">
            <button onclick="showList('must')" class="w-full bg-amber-600 hover:bg-amber-500 p-8 rounded-3xl flex flex-col items-center shadow-lg transition-all active:scale-95">
                <span class="text-3xl mb-2">🚨</span>
                <span class="font-black text-xl italic tracking-tight">MUST KNOW</span>
                <span class="text-xs opacity-90 mt-1 font-medium">Memory Items & Bold-Face</span>
            </button>
            <button onclick="showList('all')" class="w-full bg-slate-800 hover:bg-slate-700 p-8 rounded-3xl flex flex-col items-center shadow-lg transition-all active:scale-95">
                <span class="text-3xl mb-2">📋</span>
                <span class="font-black text-xl italic tracking-tight">TÜMÜ (ALL)</span>
                <span class="text-xs opacity-70 mt-1 font-medium text-slate-300">Tüm Sistem ve Acil Durumlar</span>
            </button>
        </div>

        <div id="list-screen" class="hidden animate-fade-in">
            <div class="flex items-center justify-between mb-6">
                <button onclick="showCategory()" class="text-slate-400 font-bold text-sm">← GERİ</button>
                <span id="list-title" class="text-amber-500 font-black text-sm tracking-widest uppercase"></span>
            </div>
            <div id="checklist-links" class="space-y-3"></div>
        </div>

        <div id="mode-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-6 z-50 backdrop-blur-sm">
            <div class="bg-slate-900 border border-slate-700 p-8 rounded-3xl w-full max-w-xs shadow-2xl">
                <h3 class="text-xl font-black mb-6 text-center text-white">ÇALIŞMA MODU</h3>
                <div class="space-y-4">
                    <button onclick="startQuiz(false)" class="w-full bg-sky-600 p-4 rounded-2xl font-black shadow-lg">SIRAYLA (Step-by-Step)</button>
                    <button onclick="startQuiz(true)" class="w-full bg-purple-600 p-4 rounded-2xl font-black shadow-lg text-white">KARIŞIK (Random Test)</button>
                    <button onclick="closeModal()" class="w-full text-slate-500 font-bold text-sm pt-2">İPTAL</button>
                </div>
            </div>
        </div>

        <div id="quiz-screen" class="hidden">
            <div class="flex justify-between items-center mb-8">
                <button onclick="showList(currentCategory)" class="bg-slate-800 p-2 rounded-lg text-xs font-bold uppercase">Kapat</button>
                <div id="progress" class="font-black text-amber-500 bg-amber-500/10 px-4 py-1 rounded-full text-sm"></div>
            </div>
            
            <h2 id="current-title" class="text-2xl font-black mb-8 text-center leading-tight"></h2>
            
            <div class="space-y-6">
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-2xl">
                    <div class="space-y-5">
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase mb-2 ml-1">ITEM (Kontrol Noktası)</label>
                            <input type="text" id="user-item" class="w-full bg-slate-800 border-2 border-slate-700 p-4 rounded-2xl focus:outline-none focus:border-amber-500 text-white font-bold transition-all" placeholder="..." autocomplete="off">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase mb-2 ml-1">ACTION (Yapılacak İşlem)</label>
                            <input type="text" id="user-action" class="w-full bg-slate-800 border-2 border-slate-700 p-4 rounded-2xl focus:outline-none focus:border-amber-500 text-white font-bold transition-all" placeholder="..." autocomplete="off">
                        </div>
                    </div>
                    <button onclick="checkAnswer()" class="w-full bg-amber-600 mt-8 py-5 rounded-2xl font-black text-xl shadow-lg active:scale-95 transition-all uppercase tracking-tighter">KONTROL ET</button>
                    <div id="feedback" class="mt-6 p-4 rounded-2xl hidden text-center font-bold"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const checklists = {
            "1": { name: "Engine Failure during Take-off Run", must: true, steps: [{i:"Throttle", a:"IDLE"}, {i:"Brakes", a:"as required"}, {i:"Flaps", a:"CRUISE"}, {i:"Mixture", a:"IDLE CUT-OFF"}, {i:"Ignition Switch", a:"OFF"}, {i:"GEN/BAT Master Switch", a:"OFF"}] },
            "2": { name: "Engine Failure after Take-off", must: true, steps: [{i:"Airspeed", a:"60 KIAS"}, {i:"Throttle", a:"FULL"}, {i:"Mixture", a:"FULL RICH"}, {i:"Alternate Air", a:"ON"}, {i:"Fuel Shut-off Valve", a:"OPEN"}, {i:"Ignition Switch", a:"BOTH"}, {i:"Fuel Pump", a:"ON"}] },
            "3": { name: "Engine Failure during Flight (Rough)", must: true, steps: [{i:"Mixture", a:"FULL RICH"}, {i:"Alternate Air", a:"OPEN"}, {i:"Fuel Shut-off Valve", a:"OPEN"}, {i:"Fuel Pump", a:"ON"}, {i:"Ignition Switch", a:"cycle L-BOTH-R-BOTH"}, {i:"Throttle", a:"at present position"}] },
            "4": { name: "Restarting Engine (Windmilling)", must: true, steps: [{i:"Airspeed", a:"73 KIAS"}, {i:"Mixture", a:"FULL RICH"}, {i:"Fuel Shut-off Valve", a:"OPEN"}, {i:"Ignition Switch", a:"BOTH"}, {i:"Fuel Pump", a:"ON"}, {i:"Fuel Prime", a:"ON"}, {i:"Throttle", a:"3/4 in forward"}] },
            "5": { name: "Emergency Landing with Engine Off", must: true, steps: [{i:"Airspeed (Flaps T/O)", a:"60 KIAS"}, {i:"Fuel Shut-off Valve", a:"CLOSED"}, {i:"Mixture", a:"IDLE CUT-OFF"}, {i:"Ignition Switch", a:"OFF"}, {i:"Safety Belts", a:"secured"}, {i:"Radio", a:"121.5 Mhz"}, {i:"GEN/BAT Master Switch", a:"OFF"}] },
            "6": { name: "Trim System Failure (Runaway)", must: true, steps: [{i:"Control Stick", a:"Grip and maintain control"}, {i:"Trim motor circuit breaker", a:"Pull"}, {i:"Rocker Switch", a:"Check"}] },
            "7": { name: "Flap System Failure", must: true, steps: [{i:"Visual Check", a:"Verify position"}, {i:"Flap Control Circuit Breaker", a:"Check/Reset"}, {i:"Flap Switch", a:"Check"}, {i:"Airspeed", a:"Within white arc"}] },
            "8": { name: "Engine Fire during Flight", must: false, steps: [{i:"Fuel Shut-off Valve", a:"CLOSED"}, {i:"Cabin Heat", a:"CLOSED"}, {i:"Airspeed", a:"73 KIAS"}, {i:"Fuel Pump", a:"OFF"}] },
            "9": { name: "Electrical Fire during Flight", must: false, steps: [{i:"GEN/BAT Master Switch", a:"OFF"}, {i:"Cabin Air", a:"OPEN"}, {i:"Avionics Master Switch", a:"OFF"}, {i:"Circuit Breakers", a:"Pull all"}] },
            "10": { name: "Recovery from Unintentional Spin", must: false, steps: [{i:"Throttle", a:"IDLE"}, {i:"Rudder", a:"fully opposite to spin"}, {i:"Control Stick", a:"ease forward"}, {i:"Wing Flaps", a:"CRUISE"}] },
            "11": { name: "Precautionary Landing", must: false, steps: [{i:"Search for a landing site", a:"Select field"}, {i:"Safety Belts", a:"Secured"}, {i:"Airspeed", a:"60 KIAS"}, {i:"Flaps", a:"T/O"}] },
            "12": { name: "Generator Failure (Low Voltage)", must: false, steps: [{i:"GEN Master Switch", a:"Cycle OFF-ON"}, {i:"Non-essential equipment", a:"OFF"}, {i:"Ammeter", a:"Monitor"}] },
            "13": { name: "Icing / Pitot Heat Failure", must: false, steps: [{i:"Pitot Heat", a:"ON"}, {i:"Icing area", a:"Leave immediately"}, {i:"Cabin Heat", a:"OPEN"}] },
            "14": { name: "Engine Fire on Ground", must: false, steps: [{i:"Fuel Shut-off Valve", a:"CLOSED"}, {i:"Mixture", a:"IDLE CUT-OFF"}, {i:"Ignition Switch", a:"OFF"}, {i:"Master Switch", a:"OFF"}] }
        };

        let currentCategory = 'all';
        let selectedChecklistId = null;
        let currentSteps = [];
        let currentIndex = 0;
        let wrongSteps = [];

        document.getElementById('user-item').addEventListener('keypress', (e) => { if(e.key === 'Enter') document.getElementById('user-action').focus(); });
        document.getElementById('user-action').addEventListener('keypress', (e) => { if(e.key === 'Enter') checkAnswer(); });

        function showCategory() {
            document.getElementById('category-screen').classList.remove('hidden');
            document.getElementById('list-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
        }

        function showList(cat) {
            currentCategory = cat;
            document.getElementById('category-screen').classList.add('hidden');
            document.getElementById('list-screen').classList.remove('hidden');
            document.getElementById('list-title').innerText = cat === 'must' ? "🚨 MUST KNOW" : "📋 TÜM LİSTE";
            
            const container = document.getElementById('checklist-links');
            container.innerHTML = '';
            
            Object.keys(checklists).forEach(id => {
                if(cat === 'all' || (cat === 'must' && checklists[id].must)) {
                    const btn = document.createElement('div');
                    btn.className = `bg-slate-900 p-5 rounded-2xl border border-slate-800 flex justify-between items-center active:bg-slate-800 transition shadow-sm ${checklists[id].must ? 'must-know' : 'all-item'}`;
                    btn.onclick = () => openModeModal(id);
                    btn.innerHTML = `<span class="font-bold text-sm">${checklists[id].name}</span><span class="text-slate-600">→</span>`;
                    container.appendChild(btn);
                }
            });
        }

        function openModeModal(id) {
            selectedChecklistId = id;
            document.getElementById('mode-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('mode-modal').classList.add('hidden'); }

        function startQuiz(shuffle) {
            closeModal();
            const quiz = checklists[selectedChecklistId];
            currentSteps = [...quiz.steps];
            if(shuffle) currentSteps.sort(() => Math.random() - 0.5);
            currentIndex = 0; wrongSteps = [];
            document.getElementById('list-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('current-title').innerText = quiz.name;
            nextQuestion();
        }

        function nextQuestion() {
            if (currentIndex >= currentSteps.length) {
                if (wrongSteps.length > 0) {
                    alert("Şimdi yanlış yaptığın adımları tekrar ediyoruz!");
                    currentSteps = [...wrongSteps];
                    wrongSteps = []; currentIndex = 0;
                    nextQuestion();
                } else {
                    alert("TEBRİKLER! Bu prosedürü hatasız tamamladın.");
                    showList(currentCategory);
                }
                return;
            }
            document.getElementById('progress').innerText = `${currentIndex + 1}/${currentSteps.length}`;
            document.getElementById('user-item').value = "";
            document.getElementById('user-action').value = "";
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('user-item').focus();
        }

        function checkAnswer() {
            const ui = document.getElementById('user-item').value.trim().toLowerCase();
            const ua = document.getElementById('user-action').value.trim().toLowerCase();
            const correct = currentSteps[currentIndex];
            const feedback = document.getElementById('feedback');

            feedback.classList.remove('hidden');
            if (ui === correct.i.toLowerCase() && ua === correct.a.toLowerCase()) {
                feedback.className = "mt-6 p-4 rounded-2xl text-center bg-green-500/20 text-green-400 border border-green-500/50";
                feedback.innerText = "✅ DOĞRU";
                setTimeout(() => { currentIndex++; nextQuestion(); }, 700);
            } else {
                feedback.className = "mt-6 p-4 rounded-2xl text-center bg-red-500/20 text-red-400 border border-red-500/50";
                feedback.innerHTML = `<div class="text-[10px] opacity-70 mb-1">DOĞRUSU:</div><div>${correct.i} → ${correct.a}</div>`;
                wrongSteps.push(correct);
                setTimeout(() => { currentIndex++; nextQuestion(); }, 3000);
            }
        }
    </script>
</body>
</html>
